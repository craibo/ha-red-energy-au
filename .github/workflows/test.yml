name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # homeassistant>=2026.3.0 requires Python>=3.14.2, so each matrix
        # leg needs an explicit floor compatible with its interpreter.
        if [ "${{ matrix.python-version }}" = "3.13" ]; then
          pip install "homeassistant>=2025.1.0,<2026.3.0"
        else
          pip install "homeassistant>=2026.3.0"
        fi
        pip install -r requirements-test.txt
    
    - name: Lint with flake8
      run: |
        # Install flake8 if not in requirements
        pip install flake8
        # Stop the build if there are Python syntax errors or undefined names
        flake8 custom_components --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings. GitHub editor is 127 chars wide
        flake8 custom_components --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Test with pytest
      run: |
        pytest tests/ -v --tb=short
      continue-on-error: true
    
    - name: Type check with mypy
      run: |
        pip install mypy
        mypy custom_components/red_energy --ignore-missing-imports
      continue-on-error: true